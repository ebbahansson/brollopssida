<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Omdirigerar...</title>
  <script>
    // Mappa SEO-vänliga URL:er till faktiska filer
    const path = window.location.pathname;
    
    const redirects = {
      // Svenska URL:er
      '/om-oss': '/page1.html',
      '/om-oss/': '/page1.html',
      '/resa-och-boende': '/page2.html',
      '/resa-och-boende/': '/page2.html',
      '/om-rwanda': '/page3.html',
      '/om-rwanda/': '/page3.html',
      '/formular': '/form.html',
      '/formular/': '/form.html',
      // Engelska URL:er
      '/about-us': '/page1.html',
      '/about-us/': '/page1.html',
      '/travel-and-accommodation': '/page2.html',
      '/travel-and-accommodation/': '/page2.html',
      '/about-rwanda': '/page3.html',
      '/about-rwanda/': '/page3.html',
      '/form': '/form.html',
      '/form/': '/form.html'
    };
    
    const targetFile = redirects[path];
    
    if (targetFile) {
      // Sätt språk baserat på URL:en
      const englishUrls = ['/about-us', '/about-us/', '/travel-and-accommodation', '/travel-and-accommodation/', '/about-rwanda', '/about-rwanda/', '/form', '/form/'];
      if (englishUrls.includes(path)) {
        localStorage.setItem('language', 'en');
      } else {
        localStorage.setItem('language', 'sv');
      }
      
      // Ladda filen utan att ändra URL:en
      fetch(targetFile)
        .then(response => response.text())
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(() => {
          // Om fetch misslyckas, gå till startsidan
          window.location.replace('/');
        });
    } else {
      // Om ingen match, gå till startsidan
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>Laddar sida...</p>
</body>
</html>
