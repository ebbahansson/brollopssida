<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Omdirigerar...</title>
  <script>
    // Mappa SEO-vänliga URL:er till faktiska filer
    const path = window.location.pathname;
    
    const redirects = {
      '/om-oss': '/page1.html',
      '/om-oss/': '/page1.html',
      '/resa-och-boende': '/page2.html',
      '/resa-och-boende/': '/page2.html',
      '/om-rwanda': '/page3.html',
      '/om-rwanda/': '/page3.html',
      '/formular': '/form.html',
      '/formular/': '/form.html'
    };
    
    const targetFile = redirects[path];
    
    if (targetFile) {
      // Ladda filen utan att ändra URL:en
      fetch(targetFile)
        .then(response => response.text())
        .then(html => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(() => {
          // Om fetch misslyckas, gå till startsidan
          window.location.replace('/');
        });
    } else {
      // Om ingen match, gå till startsidan
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>Laddar sida...</p>
</body>
</html>
