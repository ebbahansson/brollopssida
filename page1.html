<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Om oss</title>
  <link rel="icon" type="image/png" href="bilder/Favicon/favicon_apa.png">
  <link rel="apple-touch-icon" href="bilder/Favicon/favicon_apa.png">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========================================
       HEADER MED HAMBURGER
       ======================================== -->
  <header class="page-header" id="pageHeader">
    <a href="/">
      <img src="bilder/header/Bryan_Ebba.png" alt="Logga" class="page-header-logo">
    </a>
    <div class="header-controls">
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Öppna meny">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      <nav class="hamburger-menu" id="hamburgerMenu" aria-hidden="true">
        <div class="menu-logo">
          <img src="bilder/header/Bryan_Ebba.png" alt="Bryan & Ebba logga">
        </div>
        <ul>
          <li><a href="/" data-i18n="nav-home">Hem</a></li>
          <li><a href="/om-oss" data-i18n="nav-about">Om oss</a></li>
          <li><a href="/resa-och-boende" data-i18n="nav-travel">Resa och boende</a></li>
          <li><a href="/om-rwanda" data-i18n="nav-rwanda">Om Rwanda</a></li>
          <li><a href="/formular" data-i18n="nav-form">Formulär</a></li>
        </ul>
        <button class="language-btn" id="languageBtn" aria-label="Byt språk">
          <span class="globe-icon">🌏︎</span>
          <span class="lang-text">EN</span>
        </button>
      </nav>
      <div class="menu-overlay" id="menuOverlay"></div>
    </div>
  </header>

  <!-- ========================================
       SCROLLBAR BILD
       ======================================== -->
  <img src="bilder/sida1/story_2.png" alt="Om oss - scrollbar bild" class="page1-scrollable-image">

  <!-- ========================================
       FOOTER
       ======================================== -->
  <footer class="footer">
    <!-- Easter Egg-knapp -->
    <button class="easter-egg-trigger" id="easterEggBtn" aria-label="Hemligt spel" data-i18n-aria="easter-egg-secret">
      <img src="bilder/apa/roligasaker_sv_v.png" alt="Hemlig bild" class="ape-sv" />
      <img src="bilder/apa/roligasaker_sv_v.png" alt="Secret image" class="ape-en" style="display: none;" />
    </button>
  </footer>

  <!-- ========================================
       EASTER EGG - SNAKE-SPEL POPUP
       ======================================== -->
  <div id="easterEggPopup" class="egg-overlay" aria-hidden="true">
    <div class="egg-box" role="dialog" aria-modal="true" aria-labelledby="eggTitle">
      <button class="egg-close" type="button" aria-label="Stäng" id="eggCloseBtn">✕</button>

      <!-- Startskärm -->
      <div id="startScreen">
        <h1 style="font-family: 'Kage2', cursive; color: #efbc22; font-size: 3rem; margin: 0 0 0.5rem 0;" data-i18n="game-title">Kyssjakten 💋</h1>
        <h2 id="eggTitle" style="font-family: 'Codesaver', monospace; font-size: 1.5rem; color: #fff5d6;" data-i18n="game-subtitle">Hur många kyssar kan Ebba få?</h2>
        <button id="startGameBtn" class="start-btn" data-i18n="game-start">Starta</button>
      </div>

      <!-- Spelyta -->
      <div id="gameScreen" style="display:none;">
        <div class="game-top">
          <p id="score" class="score">Kyssar: 0</p>
          <button id="restartBtn" class="restart-btn" type="button" style="display:none;" data-i18n="game-restart">Spela igen</button>
        </div>
        <div class="game-content-wrapper">
          <canvas id="snakeCanvas"></canvas>
          <div class="game-right-sidebar">
            <p class="hint" data-i18n="game-hint">Styr Bryan med hjälp av piltangenterna!</p>
            <div id="highScoreList" class="highscore-container"></div>
          </div>
        </div>
        <!-- Mobila kontroller -->
        <div class="mobile-controls" id="mobileControls">
          <button class="arrow-btn arrow-up" id="arrowUp" aria-label="Upp">▲</button>
          <div class="arrow-row">
            <button class="arrow-btn arrow-left" id="arrowLeft" aria-label="Vänster">◄</button>
            <button class="arrow-btn arrow-down" id="arrowDown" aria-label="Ner">▼</button>
            <button class="arrow-btn arrow-right" id="arrowRight" aria-label="Höger">►</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
